<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Rainbow Tiles</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* The Parent Container holds the seamless gradient */
        .container {
            display: grid;
            width: 100vw;
            height: 100vh;
            /* Rainbow gradient across the entire viewport */
            background: linear-gradient(45deg, 
                red, orange, yellow, green, cyan, blue, magenta, red);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            
            /* Fibonacci-inspired grid proportions */
            grid-template-columns: 1fr 1fr 2fr 3fr 5fr 8fr 13fr 21fr;
            grid-template-rows: 1fr 1fr 2fr 3fr 5fr 8fr;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* The Tiles */
        .tile {
            border: 1px solid rgba(255, 255, 255, 0.3);
            /* 
               Crucial: Use background: inherit or transparency 
               so the parent's gradient shows through.
            */
            background: transparent; 
            transition: background 0.3s;
        }

        .tile:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container" id="grid">
        <!-- Tiles will be generated by JS to ensure exactly 50 -->
    </div>

    <script>
        const grid = document.getElementById('grid');
        const totalTiles = 50;

        for (let i = 0; i < totalTiles; i++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            
            // Randomly assign span values to create the "Fibonacci" feel 
            // rather than a perfect grid, filling the space randomly.
            const fibs = [1, 1, 2, 3, 5, 8];
            const colSpan = fibs[Math.floor(Math.random() * fibs.length)];
            const rowSpan = fibs[Math.floor(Math.random() * fibs.length)];
            
            // We constrain the spans slightly to ensure they fit the 50-tile limit
            // while maintaining the proportional look.
            tile.style.gridColumn = `span ${Math.min(colSpan, 3)}`;
            tile.style.gridRow = `span ${Math.min(rowSpan, 2)}`;
            
            grid.appendChild(tile);
        }

        // Adjustment to ensure the grid is perfectly filled without gaps
        // by forcing the last few tiles to stretch to the end.
        const tiles = document.querySelectorAll('.tile');
        tiles[tiles.length - 1].style.gridColumn = "span 10";
        tiles[tiles.length - 1].style.gridRow = "span 10";
    </script>
</body>
</html>
