<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Rainbow Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(45deg, 
                hsl(0, 100%, 50%),
                hsl(60, 100%, 50%),
                hsl(120, 100%, 50%),
                hsl(180, 100%, 50%),
                hsl(240, 100%, 50%),
                hsl(300, 100%, 50%),
                hsl(360, 100%, 50%)
            );
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .grid-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            gap: 1px;
            background: black;
        }

        .tile {
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* First 20 Fibonacci numbers for sizing */
        :root {
            --f0: 1;
            --f1: 1;
            --f2: 2;
            --f3: 3;
            --f4: 5;
            --f5: 8;
            --f6: 13;
            --f7: 21;
            --f8: 34;
            --f9: 55;
            --f10: 89;
            --f11: 144;
            --f12: 233;
            --f13: 377;
            --f14: 610;
        }

        /* Responsive grid layout based on Fibonacci sequence */
        @media (min-width: 1200px) and (min-height: 800px) {
            .grid-container {
                grid-template-columns: 
                    calc(var(--f0) * 1fr) 
                    calc(var(--f1) * 1fr) 
                    calc(var(--f2) * 1fr) 
                    calc(var(--f3) * 1fr) 
                    calc(var(--f4) * 1fr) 
                    calc(var(--f5) * 1fr) 
                    calc(var(--f6) * 1fr) 
                    calc(var(--f7) * 1fr);
                
                grid-template-rows: 
                    calc(var(--f0) * 1fr) 
                    calc(var(--f1) * 1fr) 
                    calc(var(--f2) * 1fr) 
                    calc(var(--f3) * 1fr) 
                    calc(var(--f4) * 1fr) 
                    calc(var(--f5) * 1fr) 
                    calc(var(--f6) * 1fr);
            }
        }

        @media (max-width: 1199px) or (max-height: 799px) {
            .grid-container {
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(10, 1fr);
            }
        }

        /* Individual tile positioning using nth-child */
        .tile:nth-child(1) { grid-column: 1 / 2; grid-row: 1 / 2; }
        .tile:nth-child(2) { grid-column: 2 / 3; grid-row: 1 / 2; }
        .tile:nth-child(3) { grid-column: 3 / 4; grid-row: 1 / 2; }
        .tile:nth-child(4) { grid-column: 4 / 5; grid-row: 1 / 2; }
        .tile:nth-child(5) { grid-column: 5 / 6; grid-row: 1 / 2; }

        .tile:nth-child(6) { grid-column: 1 / 2; grid-row: 2 / 3; }
        .tile:nth-child(7) { grid-column: 2 / 3; grid-row: 2 / 3; }
        .tile:nth-child(8) { grid-column: 3 / 4; grid-row: 2 / 3; }
        .tile:nth-child(9) { grid-column: 4 / 5; grid-row: 2 / 3; }
        .tile:nth-child(10) { grid-column: 5 / 6; grid-row: 2 / 3; }

        .tile:nth-child(11) { grid-column: 1 / 2; grid-row: 3 / 4; }
        .tile:nth-child(12) { grid-column: 2 / 3; grid-row: 3 / 4; }
        .tile:nth-child(13) { grid-column: 3 / 4; grid-row: 3 / 4; }
        .tile:nth-child(14) { grid-column: 4 / 5; grid-row: 3 / 4; }
        .tile:nth-child(15) { grid-column: 5 / 6; grid-row: 3 / 4; }

        .tile:nth-child(16) { grid-column: 1 / 2; grid-row: 4 / 5; }
        .tile:nth-child(17) { grid-column: 2 / 3; grid-row: 4 / 5; }
        .tile:nth-child(18) { grid-column: 3 / 4; grid-row: 4 / 5; }
        .tile:nth-child(19) { grid-column: 4 / 5; grid-row: 4 / 5; }
        .tile:nth-child(20) { grid-column: 5 / 6; grid-row: 4 / 5; }

        .tile:nth-child(21) { grid-column: 1 / 2; grid-row: 5 / 6; }
        .tile:nth-child(22) { grid-column: 2 / 3; grid-row: 5 / 6; }
        .tile:nth-child(23) { grid-column: 3 / 4; grid-row: 5 / 6; }
        .tile:nth-child(24) { grid-column: 4 / 5; grid-row: 5 / 6; }
        .tile:nth-child(25) { grid-column: 5 / 6; grid-row: 5 / 6; }

        .tile:nth-child(26) { grid-column: 1 / 2; grid-row: 6 / 7; }
        .tile:nth-child(27) { grid-column: 2 / 3; grid-row: 6 / 7; }
        .tile:nth-child(28) { grid-column: 3 / 4; grid-row: 6 / 7; }
        .tile:nth-child(29) { grid-column: 4 / 5; grid-row: 6 / 7; }
        .tile:nth-child(30) { grid-column: 5 / 6; grid-row: 6 / 7; }

        .tile:nth-child(31) { grid-column: 1 / 2; grid-row: 7 / 8; }
        .tile:nth-child(32) { grid-column: 2 / 3; grid-row: 7 / 8; }
        .tile:nth-child(33) { grid-column: 3 / 4; grid-row: 7 / 8; }
        .tile:nth-child(34) { grid-column: 4 / 5; grid-row: 7 / 8; }
        .tile:nth-child(35) { grid-column: 5 / 6; grid-row: 7 / 8; }

        .tile:nth-child(36) { grid-column: 1 / 2; grid-row: 8 / 9; }
        .tile:nth-child(37) { grid-column: 2 / 3; grid-row: 8 / 9; }
        .tile:nth-child(38) { grid-column: 3 / 4; grid-row: 8 / 9; }
        .tile:nth-child(39) { grid-column: 4 / 5; grid-row: 8 / 9; }
        .tile:nth-child(40) { grid-column: 5 / 6; grid-row: 8 / 9; }

        .tile:nth-child(41) { grid-column: 1 / 2; grid-row: 9 / 10; }
        .tile:nth-child(42) { grid-column: 2 / 3; grid-row: 9 / 10; }
        .tile:nth-child(43) { grid-column: 3 / 4; grid-row: 9 / 10; }
        .tile:nth-child(44) { grid-column: 4 / 5; grid-row: 9 / 10; }
        .tile:nth-child(45) { grid-column: 5 / 6; grid-row: 9 / 10; }

        .tile:nth-child(46) { grid-column: 1 / 2; grid-row: 10 / 11; }
        .tile:nth-child(47) { grid-column: 2 / 3; grid-row: 10 / 11; }
        .tile:nth-child(48) { grid-column: 3 / 4; grid-row: 10 / 11; }
        .tile:nth-child(49) { grid-column: 4 / 5; grid-row: 10 / 11; }
        .tile:nth-child(50) { grid-column: 5 / 6; grid-row: 10 / 11; }

        /* Seamless gradient overlay to ensure continuity */
        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, 
                hsl(0, 100%, 50%),
                hsl(60, 100%, 50%),
                hsl(120, 100%, 50%),
                hsl(180, 100%, 50%),
                hsl(240, 100%, 50%),
                hsl(300, 100%, 50%),
                hsl(360, 100%, 50%)
            );
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            pointer-events: none;
            mix-blend-mode: multiply;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="grid-container" id="gridContainer"></div>
    <div class="gradient-overlay"></div>

    <script>
        // Generate 50 divs
        const container = document.getElementById('gridContainer');
        
        for (let i = 1; i <= 50; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.setAttribute('data-index', i);
            container.appendChild(tile);
        }

        // Optional: Add interactivity
        document.querySelectorAll('.tile').forEach(tile => {
            tile.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.02)';
                this.style.transition = 'transform 0.2s ease';
            });
            
            tile.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
