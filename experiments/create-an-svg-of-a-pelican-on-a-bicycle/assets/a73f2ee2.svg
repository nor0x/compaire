  </g>

  
  <g id="pelican" transform="translate(260, 150) scale(1.2)">
    
    <path d="M0,0               C10,-20 30,-20 40,0               C30,30 20,30 -0,0               C-20,30 -30,30 -40,0               C-30,-20 -10,-20 0,0 Z" fill="#4a90e2" stroke="#34599e" stroke-width="1.5" />

    
    <polygon points="40,0 50,5 50,-5" fill="#ff9900" stroke="#cc7700" stroke-width="1" />

    
    <circle cx="35" cy="-5" r="2" fill="#fff" />
    <circle cx="36" cy="-5" r="1" fill="#000" />

    
    <path d="M0,0               C-30,-20 -40,20 -20,30               C-10,20 0,10 0,0 Z" fill="#4a90e2" stroke="#34599e" stroke-width="1" />

    
    <path d="M-20,30 C-45,10 -50,30 -30,20 Z" fill="#4a90e2" opacity="0.7" />
  </g>
