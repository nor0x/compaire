<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" version="1.1">
  
  <g id="bicycle">
    
    <circle cx="120" cy="250" r="40" fill="#333" stroke="#000" stroke-width="2" />
    
    <circle cx="260" cy="250" r="40" fill="#333" stroke="#000" stroke-width="2" />
    
    <line x1="160" y1="250" x2="200" y2="190" stroke="#555" stroke-width="3" stroke-linecap="round" />
    
    <line x1="120" y1="250" x2="120" y2="180" stroke="#555" stroke-width="3" stroke-linecap="round" />
    
    <line x1="200" y1="190" x2="260" y2="250" stroke="#555" stroke-width="3" stroke-linecap="round" />
    
    <rect x="118" y="180" width="4" height="30" fill="#555" />
    <rect x="112" y="210" width="20" height="8" rx="2" fill="#555" />
    
    <path d="M240,190 q30,-30 60,0" stroke="#555" stroke-width="3" fill="none" stroke-linecap="round" />
    
    <line x1="260" y1="250" x2="260" y2="210" stroke="#555" stroke-width="3" stroke-linecap="round" />
    
    <circle cx="180" cy="250" r="6" fill="#555" />
