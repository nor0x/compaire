name: deploy

# Publishes the showcase to GitHub Pages whenever main moves. Enable Pages for
# the repository with "Source: GitHub Actions" before the first run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: uv sync --locked

      # The site reads index.json; rebuild it so a merge can never ship a stale
      # one, even though CI also checks it on the pull request.
      - name: Rebuild the experiment index
        run: uv run compaire index

      - name: Build the site
        working-directory: app
        run: npm ci && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
